name: Tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Engine tests
        run: node scripts/run_tests.js
      - name: Worked examples run (verdict changes are reported, not failed)
        run: node scripts/check_examples.js
