name: Update prices (daily)

on:
  schedule:
    - cron: '17 11 * * *'   # every day 11:17 UTC
  workflow_dispatch:
    inputs:
      force:
        description: 'Apply price changes larger than the hold threshold (normally held for review)'
        type: boolean
        default: false

permissions:
  contents: write
  pages: write

concurrency:
  group: update-prices
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Pull API and GPU rental prices
        run: python scripts/update_prices.py ${{ inputs.force && '--force' || '' }}

      # Re-check the worked examples against today's prices; a changed verdict shows in the app header.
      - name: Check worked examples
        run: node scripts/check_examples.js || echo "::warning::Example check failed to run"

      - name: Commit and publish
        id: commit
        run: |
          if git diff --quiet data/; then
            echo "No changes to commit."
            exit 0
          fi
          n=$(python -c "import json; print(json.load(open('data/price-status.json'))['values_changed'])")
          git config user.name "price-update-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/
          git commit -m "Daily price check ($(date -u +%Y-%m-%d)): $n price(s) changed"
          # Someone may have published from the admin console while the job ran: replay on top instead of failing.
          git pull --rebase origin main
          git push
          echo "pushed=true" >> "$GITHUB_OUTPUT"

      # Pushes made with the workflow token may not start a Pages build on their own.
      - name: Rebuild the site
        if: steps.commit.outputs.pushed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api -X POST "repos/${{ github.repository }}/pages/builds" || echo "::warning::Could not trigger a Pages build; the next push will publish the new prices."
