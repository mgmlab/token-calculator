<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Engine Tests</title>
  <style>
    :root { color-scheme: light; --bg: #fcfcfb; --text: #0b0b0b; --ok: #16603a; --bad: #b42323; }
    @media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) { color-scheme: dark; --bg: #1a1a19; --text: #fff; --ok: #8fdcb0; --bad: #f08c8c; } }
    body { font: 14px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif; background: var(--bg); color: var(--text); margin: 0; padding: 24px 16px; }
    h1 { font-size: 18px; margin: 0 0 8px; }
    #summary { font-weight: 600; font-size: 16px; }
    .pass { color: var(--ok); } .fail { color: var(--bad); }
    ul { padding-left: 0; list-style: none; }
  </style>
</head>
<body>
  <h1>AI Inference Economics Calculator — engine tests</h1>
  <div id="summary">running…</div>
  <ul id="list"></ul>
  <script src="../js/util.js"></script>
  <script src="../js/data-store.js"></script>
  <script src="../js/workload.js"></script>
  <script src="../js/exclusions.js"></script>
  <script src="../js/engines/onprem.js"></script>
  <script src="../js/engines/cloud.js"></script>
  <script src="../js/engines/api.js"></script>
  <script src="../js/breakeven.js"></script>
  <script src="../js/engines/hybrid.js"></script>
  <script src="../js/summary.js"></script>
  <script src="../js/examples.js"></script>
  <script src="engines.test.js"></script>
  <script>
  // Worked examples (data/examples.json) against today's real data: each must still reach its expected verdict.
  (async () => {
    const list = document.getElementById('list');
    try {
      const get = f => fetch('../data/' + f + '.json', { cache: 'no-cache' }).then(r => r.json());
      const base = {};
      for (const n of ['models', 'gpus', 'servers', 'benchmarks', 'assumptions']) base[n] = await get(n);
      const ex = (await get('examples')).examples;
      const rows = ex.map(e => { const r = TC.evaluateExample(e, base); return { e, r }; });
      const bad = rows.filter(x => !x.r.ok).length;
      list.insertAdjacentHTML('beforeend', `<li class="${bad ? 'fail' : 'pass'}">${bad ? '✗' : '✓'} worked examples keep their expected verdicts (${rows.length - bad}/${rows.length})${bad ? ' — ' + rows.filter(x => !x.r.ok).map(x => TC.esc(x.e.id + ': expected ' + x.e.expect + ', got ' + x.r.key)).join('; ') : ''}</li>`);
    } catch (err) {
      list.insertAdjacentHTML('beforeend', `<li class="fail">✗ worked examples could not be checked — ${TC.esc(err.message)}</li>`);
    }
  })();
  </script>
</body>
</html>
